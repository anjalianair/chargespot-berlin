services:
  db:
    image: postgis/postgis:17-3.5
    container_name: chargespot-db

    environment:
      POSTGRES_DB: chargespot
      POSTGRES_USER: chargespot
      POSTGRES_PASSWORD: development_password

    ports:
      - "5432:5432"

    volumes:
      - postgis_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chargespot -d chargespot"]
      interval: 5s
      timeout: 5s
      retries: 10

  features:
    image: pramsey/pg_featureserv:latest
    container_name: chargespot-features

    environment:
      DATABASE_URL: postgres://chargespot:development_password@db:5432/chargespot?sslmode=disable
      PGFS_METADATA_TITLE: ChargeSpot Berlin Feature Service
      PGFS_DATABASE_TABLEINCLUDES: api.charging_station_public,api.district_public

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "9000:9000"

  api:
    build:
      context: ./api
    container_name: chargespot-api

    environment:
      DATABASE_URL: postgresql://chargespot:development_password@db:5432/chargespot

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "8000:8000"

volumes:
  postgis_data:
  