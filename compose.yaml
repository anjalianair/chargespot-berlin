services:
  db:
    image: postgis/postgis:17-3.5
    container_name: chargespot-db

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./database/data/charging_stations.geojson:/tmp/charging_stations.geojson:ro
      - ./database/data/berlin_districts.geojson:/tmp/berlin_districts.geojson:ro
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/import_charging_stations.sql:/docker-entrypoint-initdb.d/02_import_charging_stations.sql:ro
      - ./database/import_districts.sql:/docker-entrypoint-initdb.d/03_import_districts.sql:ro
      - ./database/public_views.sql:/docker-entrypoint-initdb.d/04_public_views.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  features:
    image: pramsey/pg_featureserv:latest
    container_name: chargespot-features
    restart: unless-stopped

    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      PGFS_METADATA_TITLE: ChargeSpot Berlin Feature Service
      PGFS_DATABASE_TABLEINCLUDES: api.charging_station_public,api.district_public

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "9000:9000"

  api:
    build:
      context: ./api
    container_name: chargespot-api

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "8000:8000"

  web:
    build:
      context: ./web
    container_name: chargespot-web

    depends_on:
      api:
        condition: service_started
      features:
        condition: service_started

    ports:
      - "5173:80"

volumes:
  postgis_data:
  